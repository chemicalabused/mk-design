<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!-- Lets CSS put the prerendered hero in its pre-animation pose before
         the app hydrates (see .js rules in src/index.css). -->
    <script>document.documentElement.classList.add('js')</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title and description come from i18n (meta.* keys); scripts/prerender.mjs fills them in. -->
    <title>M Design House</title>
    <meta name="description" content="" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://mdesignhouse.eu/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:site_name" content="M Design House" />
    <meta property="og:url" content="https://mdesignhouse.eu/" />
    <meta property="og:title" content="M Design House — Architektura, wnętrza i ogrody | Nysa" />
    <meta property="og:description" content="Dom, wnętrze i ogród. Zaprojektowane jako całość. Od pierwszej rozmowy po realizację — jeden zespół i spójna wizja." />
    <meta property="og:image" content="https://mdesignhouse.eu/images/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Drewniana pergola z girlandą żarówek nad strefą wypoczynku w ogrodzie" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="M Design House — Architektura, wnętrza i ogrody | Nysa" />
    <meta name="twitter:description" content="Projektowanie domu, wnętrza i ogrodu jako całości. Nysa, Opolszczyzna, Wrocław." />
    <meta name="twitter:image" content="https://mdesignhouse.eu/images/og-image.jpg" />
    <meta name="theme-color" content="#e8e3da" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/favicon-512.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "M Design House",
        "url": "https://mdesignhouse.eu/",
        "logo": "https://mdesignhouse.eu/images/mdh-logo-dark.png",
        "description": "Pracownia architektoniczna z Nysy. Projektowanie domów, wnętrz i ogrodów oraz realizacja pod klucz.",
        "email": "mdesignhouse.biuro@gmail.com",
        "telephone": "+48 797 699 951",
        "sameAs": ["https://www.facebook.com/mdesignhouse.eu"]
      }
    </script>
    <!-- Self-hosted fonts (src/fonts.css). Preload the two that render above
         the fold: body text and the hero heading. -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
